spring.application.name=captain
# Kein Webserver: Captain spricht nur ausgehend mit Mattermost und opencode.
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=${LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-7level %logger{0}: %msg%n%throwable
