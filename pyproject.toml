[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "captain"
version = "0.1.0"
description = "Mattermost-Bot, der Nachrichten an einen opencode-Server weiterreicht"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
captain = "captain.__main__:main"

[tool.setuptools]
packages = ["captain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: braucht das laufende Test-Setup (infra/), per 'pytest -m integration'",
]
addopts = "-m 'not integration'"
