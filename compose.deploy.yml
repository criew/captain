# Captain im Betrieb gegen ein bestehendes Mattermost (README: „Betrieb mit
# bestehendem Mattermost“). Nur opencode + Bot, kein Mattermost/Postgres.
#
#   cp .env.example .env && chmod 600 .env     # ausfüllen
#   docker compose -f compose.deploy.yml up -d --build
#
# Alles steuert die .env neben dieser Datei. Alle Daten liegen unter
# CAPTAIN_HOME (Default /opt/captain) – das ist auch das Backup-Ziel:
#
#   config/    opencode.jsonc, AGENTS.md (editierbar, opencode liest sie nur)
#   data/      Bot: Session-Store sessions.json, Nachhol-Cursor
#   sessions/  Session-Verzeichnisse /tmp/captain/<session-id> (opencode + Bot)
#   opencode/  opencode-Datenbank (Sessions, Nachrichten)
#
# Optional liest opencode ein geteiltes Verzeichnis außerhalb davon
# (CAPTAIN_SHARED_DIR, schreibgeschützt unter /shared).
# Eigener Projektname, damit der Betrieb nicht mit dem Test-Setup ("captain")
# kollidiert.
name: captain-prod

# Proxy (README: „Hinter einem Proxy“). Bewusst eigene Variablennamen aus der
# .env: ein HTTP_PROXY der Host-Shell oder aus ~/.docker/config.json zeigt oft
# auf einen Namen, den nur der Host auflösen kann. Leer = kein Proxy. Die
# interne Verbindung Bot → opencode geht nie über den Proxy.
x-proxy-env: &proxy-env
  HTTP_PROXY: ${CAPTAIN_HTTP_PROXY:-}
  HTTPS_PROXY: ${CAPTAIN_HTTPS_PROXY:-}
  http_proxy: ${CAPTAIN_HTTP_PROXY:-}
  https_proxy: ${CAPTAIN_HTTPS_PROXY:-}
  NO_PROXY: opencode,captain,localhost,127.0.0.1,host.docker.internal${CAPTAIN_NO_PROXY:+,${CAPTAIN_NO_PROXY}}
  no_proxy: opencode,captain,localhost,127.0.0.1,host.docker.internal${CAPTAIN_NO_PROXY:+,${CAPTAIN_NO_PROXY}}

services:
  # Legt CAPTAIN_HOME an, kopiert fehlende Config-Vorlagen nach config/
  # (vorhandene Dateien bleiben unangetastet) und uebergibt alles an
  # CAPTAIN_UID:CAPTAIN_GID – so kommt der Host-Nutzer ohne sudo an seine
  # Dateien. Laeuft bei jedem Start kurz (als einziger Container als root).
  init:
    build:
      context: infra/opencode
      # Build im Host-Netz: DNS/hosts/Proxy des Hosts gelten auch für
      # npm/pip/curl (sonst z. B. „Cannot connect to proxy … name resolution“)
      network: host
      args:
        OPENCODE_VERSION: "2.2.0"
    image: captain/opencode:2.2.0
    user: "0:0"
    environment:
      CAPTAIN_UID: ${CAPTAIN_UID:-1000}
      CAPTAIN_GID: ${CAPTAIN_GID:-1000}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        h=/captain-home
        mkdir -p $$h/config $$h/data $$h/sessions $$h/opencode $$h/shared
        for f in /opt/captain/defaults/*; do
          [ -e "$$h/config/$${f##*/}" ] || cp "$$f" $$h/config/
        done
        chown -R "$$CAPTAIN_UID:$$CAPTAIN_GID" $$h/config $$h/data $$h/sessions $$h/opencode
        chown "$$CAPTAIN_UID:$$CAPTAIN_GID" $$h $$h/shared
        chmod 700 $$h/config $$h/data $$h/sessions $$h/opencode
        chmod 755 $$h $$h/shared
    volumes:
      - ${CAPTAIN_HOME:-/opt/captain}:/captain-home
    restart: "no"

  opencode:
    build:
      context: infra/opencode
      network: host
      args:
        OPENCODE_VERSION: "2.2.0"
    image: captain/opencode:2.2.0
    restart: unless-stopped
    user: "${CAPTAIN_UID:-1000}:${CAPTAIN_GID:-1000}"
    # Nicht die ganze .env: opencode bekommt nur, was es braucht (kein
    # MM_BOT_TOKEN). Geheimnisse für MCP-Server (MCP_*) stehen in mcp.env.
    # Das Startskript (infra/opencode/start.mjs) setzt {env:…} der
    # Admin-Config selbst ein (nur LLM_*, MCP_*, OPENCODE_MODEL/VARIANT), reicht opencode nur eine kleine Allowlist weiter
    # und setzt die Sicherheitsschalter (OPENCODE_CONFIG, OPENCODE_CONFIG_CONTENT,
    # Projekt-Config aus) fest.
    env_file:
      - path: mcp.env
        required: false
    environment:
      <<: *proxy-env
      # Zusätzliche CA-Zertifikate (z. B. Firmen-CA des LLM-Endpunkts): Datei
      # nach $CAPTAIN_HOME/config/ legen, Namen in CAPTAIN_CA_FILE eintragen.
      # Ergänzt die eingebauten CAs, ersetzt sie nicht.
      NODE_EXTRA_CA_CERTS: ${CAPTAIN_CA_FILE:+/etc/captain/}${CAPTAIN_CA_FILE:-}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD in .env setzen}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-llm/${LLM_MODEL:-}}
      OPENCODE_VARIANT: ${OPENCODE_VARIANT:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_CONTEXT: ${LLM_CONTEXT:-32768}
      LLM_OUTPUT: ${LLM_OUTPUT:-4096}
      # webfetch-Allowlist (README: „webfetch für bestimmte URLs erlauben“).
      # start.mjs macht daraus Policies und einen Egress-Filter; opencode
      # selbst bekommt die Variable nicht. Leer = webfetch aus.
      CAPTAIN_WEBFETCH_ALLOW: ${CAPTAIN_WEBFETCH_ALLOW:-}
      # Geteiltes Verzeichnis (README: „Geteiltes Verzeichnis (nur lesen)“):
      # Host-Pfad, leer = aus. start.mjs prüft ihn (absolut, nicht / oder ein
      # Systemverzeichnis, unter CAPTAIN_HOME nur shared/…) und /shared
      # (schreibgeschützt, keine Symlinks), setzt die Policies und gibt opencode
      # die Variablen nicht weiter.
      CAPTAIN_SHARED_DIR: ${CAPTAIN_SHARED_DIR:-}
      CAPTAIN_HOME: ${CAPTAIN_HOME:-/opt/captain}
      # Grenzen der Prüfung von /shared (Default 100000 Einträge, 5 s)
      CAPTAIN_SHARED_MAX_ENTRIES: ${CAPTAIN_SHARED_MAX_ENTRIES:-}
      CAPTAIN_SHARED_MAX_SECONDS: ${CAPTAIN_SHARED_MAX_SECONDS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Nur zum Debuggen (nie öffentlich): Port auf dem Host freigeben.
    # ports:
    #   - "127.0.0.1:4096:4096"
    volumes:
      # Admin-Config (Provider, Modelle, MCP, AGENTS.md) – nur lesbar
      - ${CAPTAIN_HOME:-/opt/captain}/config:/etc/captain:ro
      - ${CAPTAIN_HOME:-/opt/captain}/sessions:/tmp/captain
      - ${CAPTAIN_HOME:-/opt/captain}/opencode:/home/captain/.local/share/opencode
      # Geteiltes Verzeichnis, immer schreibgeschützt unter dem festen Pfad
      # /shared. Ohne CAPTAIN_SHARED_DIR hängt dort das leere Volume
      # "shared-leer" (kein Host-Verzeichnis) – und es gibt nichts frei.
      - ${CAPTAIN_SHARED_DIR:-shared-leer}:/shared:ro
    depends_on:
      init:
        condition: service_completed_successfully

  captain:
    build:
      context: .
      network: host
    image: captain/bot:latest
    restart: unless-stopped
    # gleiche UID wie opencode: beide schreiben in die Session-Verzeichnisse
    user: "${CAPTAIN_UID:-1000}:${CAPTAIN_GID:-1000}"
    # Zeit zum geordneten Beenden (laufende Antworten, Nachhol-Cursor sichern)
    stop_grace_period: 20s
    env_file:
      - path: .env
        required: true
    environment:
      <<: *proxy-env
      OPENCODE_URL: http://opencode:4096
      # Exakt derselbe Wert wie beim opencode-Service (sonst HTTP 401, z. B.
      # wenn die Shell eine abweichende Variable setzt oder die .env noch ein
      # altes OPENCODE_PASSWORD enthält).
      OPENCODE_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD in .env setzen}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD in .env setzen}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-llm/${LLM_MODEL:-}}
      SESSIONS_DIR: /tmp/captain
      DATA_DIR: /data
      # für die Prüfung von CAPTAIN_SHARED_DIR (nur <home>/shared erlaubt)
      CAPTAIN_HOME: ${CAPTAIN_HOME:-/opt/captain}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # REST-Eingabekanal (nur mit CAPTAIN_API_TOKEN aktiv). Default nur lokal;
    # für n8n auf einem anderen Rechner z. B. CAPTAIN_API_PUBLISH=0.0.0.0:8090.
    ports:
      - "${CAPTAIN_API_PUBLISH:-127.0.0.1:8090}:8090"
    volumes:
      - ${CAPTAIN_HOME:-/opt/captain}/data:/data
      # gleicher Pfad wie im opencode-Container
      - ${CAPTAIN_HOME:-/opt/captain}/sessions:/tmp/captain
      # z. B. Persona: CAPTAIN_SYSTEM_PROMPT_FILE=/config/persona.md
      - ${CAPTAIN_HOME:-/opt/captain}/config:/config:ro
    depends_on:
      opencode:
        condition: service_healthy

volumes:
  # Platzhalter für /shared, solange CAPTAIN_SHARED_DIR leer ist (bleibt leer:
  # nur schreibgeschützt eingebunden, das Image hat unter /shared nichts)
  shared-leer:
