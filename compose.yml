# Captain Test-Setup: Mattermost + opencode + Bot, mit Profil "review" dazu
# GitLab CE + n8n fuer das MR-Review (docs/betrieb.md: „Lokales Review-Setup“):
#   docker compose --profile review up -d
name: captain

include:
  - infra/mattermost/compose.yml
  - infra/opencode/compose.yml
  - infra/gitlab/compose.yml
  - infra/n8n/compose.yml

services:
  captain:
    build: .
    image: captain-bot:dev
    restart: unless-stopped
    # Zeit zum Abbrechen laufender Antworten und Sichern der Cursor (SIGTERM → SIGKILL)
    stop_grace_period: 20s
    env_file:
      # MM_BOT_TOKEN u. a. (von infra/mattermost/seed.py erzeugt)
      - path: infra/mattermost/generated.env
        required: true
      # OPENCODE_SERVER_PASSWORD, OPENCODE_MODEL, ggf. CAPTAIN_API_TOKEN
      - path: infra/opencode/.env
        required: true
    environment:
      # Vorrang vor env_file: dort stehen die Host-URLs (localhost)
      MM_URL: http://mattermost:8065
      OPENCODE_URL: http://opencode:4096
      SESSIONS_DIR: /tmp/captain
      DATA_DIR: /data
      # nur für den Systemhinweis (opencode liest /shared, der Bot nicht)
      CAPTAIN_SHARED_DIR: ${CAPTAIN_SHARED_DIR:-}
      # Review-Agent für n8n (Profil "review"): GitLab-MCP-Tools nur für ihn,
      # Namen wie im GitLab CE 19.2 (MCP-Server "gitlab" in infra/opencode/test/)
      CAPTAIN_REST_AGENTS: reviewer
      CAPTAIN_AGENT_TOOLS: >-
        reviewer: gitlab_get_merge_request gitlab_get_merge_request_diffs
        gitlab_get_merge_request_commits gitlab_get_merge_request_notes
        gitlab_create_merge_request_note gitlab_get_merge_request_pipelines
        gitlab_get_pipeline_jobs gitlab_get_job_log
    # REST-Eingabekanal (aktiv mit CAPTAIN_API_TOKEN in infra/opencode/.env)
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      # Session-Verzeichnisse, gleicher Pfad wie im opencode-Container
      - captain-tmp:/tmp/captain
      - captain-data:/data
    depends_on:
      opencode:
        condition: service_healthy
      # Healthcheck des Mattermost-Images prueft nur alle 30 s; der Bot
      # wartet beim Start selbst, bis Mattermost den Token akzeptiert.
      mattermost:
        condition: service_started

volumes:
  captain-data:
