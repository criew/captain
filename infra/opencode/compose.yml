# opencode-Server (headless) fuer das Captain-Test-Setup. Eingebunden ueber das
# Root-compose.yml. Betrieb: siehe compose.deploy.yml im Repo-Root.
services:
  opencode:
    build:
      context: .
      args:
        OPENCODE_VERSION: "2.2.0"
    image: captain-opencode:2.2.0
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
      # MCP_GITLAB_TOKEN fuer den lokalen GitLab-MCP-Server (infra/gitlab/seed.py)
      - path: ../gitlab/mcp.env
        required: false
    environment:
      # Geteiltes Verzeichnis (docs/betrieb.md: „Geteiltes Verzeichnis“),
      # aus der Shell; leer = aus. Der Wert muss ein Linux-Pfad sein (start.mjs
      # prüft ihn: absolut, kein Laufwerksbuchstabe).
      CAPTAIN_SHARED_DIR: ${CAPTAIN_SHARED_DIR:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4096:4096"
    volumes:
      # Session-Verzeichnisse /tmp/captain/<session-id>, geteilt mit dem Bot
      # (gleicher Name im Projekt "captain"); uebersteht Neustarts.
      - captain-tmp:/tmp/captain
      - opencode-data:/home/captain/.local/share/opencode
      # Admin-Config des Test-Setups: Vorlage plus MCP-Server "gitlab" (lokales
      # GitLab, Profil "review"); Sicherheitsbasis steckt im Image.
      - ./test/opencode.jsonc:/etc/captain/opencode.jsonc:ro
      # Agent-Prompts (reviewer.md), editierbar ohne Image-Build
      - ./config/agents:/etc/captain/agents:ro
      # Geteiltes Verzeichnis, schreibgeschützt; ohne Variable ein leeres Volume
      - ${CAPTAIN_SHARED_DIR:-shared-leer}:/shared:ro

volumes:
  captain-tmp:
  opencode-data:
  shared-leer:
