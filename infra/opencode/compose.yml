# opencode-Server (headless) fuer das Captain-Test-Setup. Eingebunden ueber das
# Root-compose.yml. Betrieb: siehe compose.deploy.yml im Repo-Root.
services:
  opencode:
    build:
      context: .
      args:
        OPENCODE_VERSION: "2.0.20"
    image: captain-opencode:2.0.20
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      # Geteiltes Verzeichnis (README: „Geteiltes Verzeichnis (nur lesen)“),
      # aus der Shell; leer = aus. Der Wert muss ein Linux-Pfad sein (start.mjs
      # prüft ihn: absolut, kein Laufwerksbuchstabe).
      CAPTAIN_SHARED_DIR: ${CAPTAIN_SHARED_DIR:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4096:4096"
    volumes:
      # Session-Verzeichnisse /tmp/captain/<session-id>, geteilt mit dem Bot
      # (gleicher Name im Projekt "captain"); uebersteht Neustarts.
      - captain-tmp:/tmp/captain
      - opencode-data:/root/.local/share/opencode
      # Admin-Config des Test-Setups (Ollama); Sicherheitsbasis steckt im Image.
      - ./config/opencode.test.jsonc:/etc/captain/opencode.jsonc:ro
      # Geteiltes Verzeichnis, schreibgeschützt; ohne Variable ein leeres Volume
      - ${CAPTAIN_SHARED_DIR:-shared-leer}:/shared:ro

volumes:
  captain-tmp:
  opencode-data:
  shared-leer:
